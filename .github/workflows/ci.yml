name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The foley repo (github.com/cumsauce/foley) is public, so cargo's git
      # deps clone without credentials. The committed [patch] section points at
      # a sibling ../foley checkout, which doesn't exist in CI — drop it so the
      # git deps at the pinned rev are used instead.
      - name: Drop dev-only sibling [patch] section
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("Cargo.toml")
          lines = p.read_text().splitlines(keepends=True)
          out = []
          skip = False
          for line in lines:
              if line.startswith('[patch."https://github.com/cumsauce/foley"'):
                  skip = True
                  continue
              if skip and line.startswith('['):
                  skip = False
              if not skip:
                  out.append(line)
          p.write_text("".join(out))
          EOF
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace

  bundle:
    name: Bundle (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Drop dev-only sibling [patch] section
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("Cargo.toml")
          lines = p.read_text().splitlines(keepends=True)
          out = []
          skip = False
          for line in lines:
              if line.startswith('[patch."https://github.com/cumsauce/foley"'):
                  skip = True
                  continue
              if skip and line.startswith('['):
                  skip = False
              if not skip:
                  out.append(line)
          p.write_text("".join(out))
          EOF
      - name: Build universal bundles
        run: |
          cargo xtask bundle-universal foley-kit --release
          cargo xtask bundle-universal foley-ambience --release
      - uses: actions/upload-artifact@v4
        with:
          name: soundslop-bundles
          path: target/bundled/
